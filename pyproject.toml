[project]
name = "productguessr"
version = "0.1.0"
description = "GeoGuessr for products, on BehaviorGPT's map of a catalog"
requires-python = ">=3.11"
dependencies = [
    "behaviorgpt @ git+https://github.com/Unbox-AI/behaviorgpt",
    "pandas>=2.2",
    "pyarrow>=17",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
